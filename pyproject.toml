[project]
name = "wenyi-gui"
version = "0.1.0"
description = "Independent PySide6 desktop interface for Wenyi."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.7",
]

[project.scripts]
wenyi-gui = "gui.main:main"

[dependency-groups]
dev = [
    "pillow>=10",
    "pyinstaller>=6",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gui"]

[tool.pytest.ini_options]
testpaths = ["gui/tests"]
