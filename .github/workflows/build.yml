name: Build Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Checkout Wenyi core
        uses: actions/checkout@v4
        with:
          repository: BigDawnGhost/wenyi
          path: vendor/wenyi

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Run GUI tests
        run: uv run pytest

      - name: Build application
        shell: pwsh
        run: ./build-windows.ps1

      - name: Smoke test core executable
        shell: pwsh
        run: ./dist/文译/trans-novel.exe --help

      - name: Create archive
        shell: pwsh
        run: |
          $Archive = "./dist/wenyi-gui-${{ github.ref_name }}-windows-x64.zip"
          Compress-Archive -Path ./dist/文译/* -DestinationPath $Archive
          $Hash = (Get-FileHash -Algorithm SHA256 $Archive).Hash.ToLower()
          "$Hash  $(Split-Path -Leaf $Archive)" | Set-Content -Encoding ascii "$Archive.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: wenyi-gui-windows-x64
          path: |
            ./dist/wenyi-gui-*-windows-x64.zip
            ./dist/wenyi-gui-*-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ./dist/wenyi-gui-*-windows-x64.zip
            ./dist/wenyi-gui-*-windows-x64.zip.sha256
